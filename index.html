<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>age calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Flatpickr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <style>
/* Import Font Google */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body {
  font-family: 'Dancing Script', sans-serif;
  background: linear-gradient(135deg, #ffd6e8, #ffc2dd, #ffb3d1);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(255, 105, 180, 0.25);
  width: 100%;
  max-width: 420px;
  text-align: center;
  transition: 0.3s ease-in-out;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 50px rgba(255, 105, 180, 0.35);
}

h2 {
  font-family: 'Great Vibes', cursive;
  font-size: 35px;
  margin-bottom: 25px;
  font-weight: 600;
  color: #d63384;
}

input,
button {
  width: 85%;
  margin: 0 auto 18px;
  display: block;
  box-sizing: border-box;
}


input {
  padding: 12px;
  margin: 0 auto 18px;
  border-radius: 12px;
  border: 2px solid #ffc2dd;
  font-size: 15px;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: #ff69b4;
  box-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
}

button {
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff69b4, #ff85c1);
  color: white;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
}

.result {
  visibility: hidden;
  opacity: 0;
  min-height: 20px; /* supaya tinggi tetap ada */
  margin-top: 20px;
  font-weight: 600;
  font-size: 18px;
  color: #c2185b;
  background: #ffe6f2;
  padding: 12px;
  border-radius: 12px;
  transition: opacity 0.3s ease;
}


.error {
  min-height: 20px; /* supaya ruang error selalu ada */
  visibility: hidden;
  color: #e53935;
  font-size: 14px;
  margin-top: 10px;
}


/* Animasi */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive */
@media (max-width: 480px) {
.card {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(255, 105, 180, 0.25);
  width: 100%;
  max-width: 420px;
  min-height: 420px; /* 🔥 TAMBAHKAN INI */
  text-align: center;
  transition: 0.3s ease-in-out;
}

}

  </style>
</head>
<body>

  <div class="card">
    <h2>Age Calculator</h2>
    <form id="ageForm">
      <input type="text" id="birthDate" placeholder="Select Date of Birth" required>
      <button type="submit">Calculate Age</button>
    </form>

    <div class="result" id="result"></div>
    <div class="error" id="error"></div>
  </div>

  <!-- Luxon -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>

  <!-- Flatpickr -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    const DateTime = luxon.DateTime;

    // Inisialisasi Datepicker
    flatpickr("#birthDate", {
      dateFormat: "Y-m-d",
      maxDate: "today"
    });

document.getElementById("ageForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const birthInput = document.getElementById("birthDate").value;
  const resultDiv = document.getElementById("result");
  const errorDiv = document.getElementById("error");

  resultDiv.textContent = "";
  errorDiv.textContent = "";
  resultDiv.style.visibility = "visible";
  resultDiv.style.opacity = "0";


if (!birthInput) {
  errorDiv.textContent = "Please select your date of birth!";
  errorDiv.style.visibility = "visible";
  return;
}


  const birthDate = DateTime.fromISO(birthInput);
  const today = DateTime.now()
    .setZone("America/New_York")
    .endOf("day");

  if (!birthDate.isValid) {
    errorDiv.textContent = "Tanggal tidak valid.";
    return;
  }

  if (birthDate > today) {
    errorDiv.textContent = "Tanggal lahir tidak boleh di masa depan.";
    return;
  }

  const diff = today.diff(birthDate, ["years", "months", "days"]).toObject();

  resultDiv.textContent =
    `Your age: ${Math.floor(diff.years)} years, ` +
    `${Math.floor(diff.months)} months, ` +
    `${Math.floor(diff.days)} days.`;

  resultDiv.style.visibility = "visible";
  resultDiv.style.opacity = "1";

});

  </script>

</body>
</html>
